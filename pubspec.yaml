name: checkr
description: "Detect counterfeit Nigerian Naira banknotes."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  stacked: ^3.4.3
  stacked_services: ^1.3.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.11.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image: ^4.1.3
  path_provider: ^2.1.2
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  stacked_generator: ^1.3.3
  build_runner: ^2.4.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/naira_autoencoder_v2.tflite
  fonts:
    - family: Sora
      fonts:
        - asset: assets/fonts/Sora.ttf
          weight: 400
        - asset: assets/fonts/Sora.ttf
          weight: 600
        - asset: assets/fonts/Sora.ttf
          weight: 700
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Medium.ttf
          weight: 500
